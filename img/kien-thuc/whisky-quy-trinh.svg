<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Sáu bước làm whisky mạch nha"><title>Sáu bước làm whisky mạch nha</title><rect width="900" height="400" rx="28" fill="#fbf1e3"/><text x="450" y="56" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="30" font-weight="700" fill="#c62a1e" text-anchor="middle">Whisky mạch nha làm ra thế nào?</text><circle cx="85" cy="160" r="54" fill="#fff" stroke="#ead9c6" stroke-width="3"/><text x="85" y="178" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="42" font-weight="400" fill="#2a1a14" text-anchor="middle">🌾</text><text x="85" y="246" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="18" font-weight="700" fill="#2a1a14" text-anchor="middle">1. Ủ mầm</text><text x="85" y="272" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a6658" text-anchor="middle">ngâm, nảy mầm, sấy</text><path d="M145 160 h24 m-8 -7 l8 7 l-8 7" stroke="#c62a1e" stroke-width="3" fill="none"/><circle cx="231" cy="160" r="54" fill="#fff" stroke="#ead9c6" stroke-width="3"/><text x="231" y="178" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="42" font-weight="400" fill="#2a1a14" text-anchor="middle">⚙️</text><text x="231" y="246" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="18" font-weight="700" fill="#2a1a14" text-anchor="middle">2. Nghiền, nấu</text><text x="231" y="272" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a6658" text-anchor="middle">nước ấm rút đường</text><path d="M291 160 h24 m-8 -7 l8 7 l-8 7" stroke="#c62a1e" stroke-width="3" fill="none"/><circle cx="377" cy="160" r="54" fill="#fff" stroke="#ead9c6" stroke-width="3"/><text x="377" y="178" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="42" font-weight="400" fill="#2a1a14" text-anchor="middle">🫧</text><text x="377" y="246" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="18" font-weight="700" fill="#2a1a14" text-anchor="middle">3. Lên men</text><text x="377" y="272" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a6658" text-anchor="middle">men → cồn</text><path d="M437 160 h24 m-8 -7 l8 7 l-8 7" stroke="#c62a1e" stroke-width="3" fill="none"/><circle cx="523" cy="160" r="54" fill="#fff" stroke="#ead9c6" stroke-width="3"/><text x="523" y="178" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="42" font-weight="400" fill="#2a1a14" text-anchor="middle">⚗️</text><text x="523" y="246" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="18" font-weight="700" fill="#2a1a14" text-anchor="middle">4. Chưng cất</text><text x="523" y="272" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a6658" text-anchor="middle">lấy phần giữa</text><path d="M583 160 h24 m-8 -7 l8 7 l-8 7" stroke="#c62a1e" stroke-width="3" fill="none"/><circle cx="669" cy="160" r="54" fill="#fff" stroke="#ead9c6" stroke-width="3"/><text x="669" y="178" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="42" font-weight="400" fill="#2a1a14" text-anchor="middle">🛢️</text><text x="669" y="246" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="18" font-weight="700" fill="#2a1a14" text-anchor="middle">5. Ủ thùng sồi</text><text x="669" y="272" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a6658" text-anchor="middle">≥ 3 năm ở Scotland</text><path d="M729 160 h24 m-8 -7 l8 7 l-8 7" stroke="#c62a1e" stroke-width="3" fill="none"/><circle cx="815" cy="160" r="54" fill="#fff" stroke="#ead9c6" stroke-width="3"/><text x="815" y="178" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="42" font-weight="400" fill="#2a1a14" text-anchor="middle">🥃</text><text x="815" y="246" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="18" font-weight="700" fill="#2a1a14" text-anchor="middle">6. Đóng chai</text><text x="815" y="272" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="13" font-weight="400" fill="#7a6658" text-anchor="middle">pha về ~40%</text><rect x="230" y="306" width="440" height="62" rx="18" fill="#fff" stroke="#f2b705" stroke-width="3"/><text x="450" y="332" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="17" font-weight="700" fill="#2a1a14" text-anchor="middle">“Phần của các thiên thần”: rượu bay hơi qua gỗ</text><text x="450" y="356" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a6658" text-anchor="middle">khoảng 2%/năm ở Scotland, có nơi tới 6%/năm ở Kentucky</text></svg>