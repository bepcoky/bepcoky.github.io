<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Ba điều dặn trước khi đọc chuỗi bài rượu bia"><title>Ba điều dặn trước khi đọc chuỗi bài rượu bia</title><rect width="900" height="400" rx="28" fill="#fbf1e3"/><text x="450" y="62" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="30" font-weight="700" fill="#c62a1e" text-anchor="middle">Rượu – bia ở Bếp Cô Kỹ: hiểu để uống ít</text><circle cx="120" cy="170" r="62" fill="#fff" stroke="#ead9c6" stroke-width="3"/><text x="120" y="190" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="46" font-weight="400" fill="#2a1a14" text-anchor="middle">🍵</text><text x="120" y="272" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a1a14" text-anchor="middle">Thưởng thức</text><text x="120" y="302" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a6658" text-anchor="middle">một ly nhỏ, uống chậm</text><circle cx="340" cy="170" r="62" fill="#fff" stroke="#ead9c6" stroke-width="3"/><text x="340" y="190" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="46" font-weight="400" fill="#2a1a14" text-anchor="middle">🙅</text><text x="340" y="272" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a1a14" text-anchor="middle">Đừng để say</text><text x="340" y="302" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a6658" text-anchor="middle">không ép, không “trăm phần trăm”</text><circle cx="560" cy="170" r="62" fill="#fff" stroke="#ead9c6" stroke-width="3"/><text x="560" y="190" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="46" font-weight="400" fill="#2a1a14" text-anchor="middle">🚫🛵</text><text x="560" y="272" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a1a14" text-anchor="middle">Không lái xe</text><text x="560" y="302" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a6658" text-anchor="middle">đã uống rượu bia thì gọi xe</text><circle cx="780" cy="170" r="62" fill="#fff" stroke="#ead9c6" stroke-width="3"/><text x="780" y="190" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="46" font-weight="400" fill="#2a1a14" text-anchor="middle">🔞</text><text x="780" y="272" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a1a14" text-anchor="middle">Dưới 18 tuổi</text><text x="780" y="302" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a6658" text-anchor="middle">không uống rượu bia</text><text x="450" y="370" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="17" font-weight="600" fill="#7a1d14" text-anchor="middle">Tổ chức Y tế Thế giới: không có mức uống rượu bia nào an toàn tuyệt đối</text></svg>