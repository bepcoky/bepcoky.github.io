<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Bốn kiểu rượu vang và nhiệt độ uống gợi ý"><title>Bốn kiểu rượu vang và nhiệt độ uống gợi ý</title><rect width="900" height="400" rx="28" fill="#fbf1e3"/><text x="450" y="56" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="30" font-weight="700" fill="#c62a1e" text-anchor="middle">Bốn kiểu rượu vang hay gặp</text><path d="M96 96 Q90 166 130 182 Q170 166 164 96 Z" fill="#fff" stroke="#7a4a20" stroke-width="3"/><path d="M93 136 Q94 168 130 180 Q166 168 167 136 Z" fill="#7b1d2a"/><rect x="126" y="182" width="8" height="40" fill="#7a4a20"/><rect x="102" y="220" width="56" height="8" rx="4" fill="#7a4a20"/><text x="130" y="276" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a1a14" text-anchor="middle">Vang đỏ</text><text x="130" y="302" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a6658" text-anchor="middle">có chát (tannin)</text><text x="130" y="326" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="15" font-weight="600" fill="#2f7a3e" text-anchor="middle">🌡 mát, không lạnh buốt</text><path d="M309 96 Q303 166 343 182 Q383 166 377 96 Z" fill="#fff" stroke="#7a4a20" stroke-width="3"/><path d="M306 136 Q307 168 343 180 Q379 168 380 136 Z" fill="#f3dc8c"/><rect x="339" y="182" width="8" height="40" fill="#7a4a20"/><rect x="315" y="220" width="56" height="8" rx="4" fill="#7a4a20"/><text x="343" y="276" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a1a14" text-anchor="middle">Vang trắng</text><text x="343" y="302" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a6658" text-anchor="middle">chua thanh</text><text x="343" y="326" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="15" font-weight="600" fill="#2f7a3e" text-anchor="middle">🌡 uống lạnh</text><path d="M522 96 Q516 166 556 182 Q596 166 590 96 Z" fill="#fff" stroke="#7a4a20" stroke-width="3"/><path d="M519 136 Q520 168 556 180 Q592 168 593 136 Z" fill="#f2a3a8"/><rect x="552" y="182" width="8" height="40" fill="#7a4a20"/><rect x="528" y="220" width="56" height="8" rx="4" fill="#7a4a20"/><text x="556" y="276" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a1a14" text-anchor="middle">Vang hồng</text><text x="556" y="302" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a6658" text-anchor="middle">nhẹ nhàng</text><text x="556" y="326" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="15" font-weight="600" fill="#2f7a3e" text-anchor="middle">🌡 uống lạnh</text><path d="M735 96 Q729 166 769 182 Q809 166 803 96 Z" fill="#fff" stroke="#7a4a20" stroke-width="3"/><path d="M732 136 Q733 168 769 180 Q805 168 806 136 Z" fill="#f7e6a6"/><rect x="765" y="182" width="8" height="40" fill="#7a4a20"/><rect x="741" y="220" width="56" height="8" rx="4" fill="#7a4a20"/><circle cx="755" cy="170" r="3" fill="#fff"/><circle cx="764" cy="164" r="3" fill="#fff"/><circle cx="773" cy="158" r="3" fill="#fff"/><circle cx="782" cy="152" r="3" fill="#fff"/><text x="769" y="276" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="22" font-weight="700" fill="#2a1a14" text-anchor="middle">Vang sủi</text><text x="769" y="302" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a6658" text-anchor="middle">bọt ga, chúc mừng</text><text x="769" y="326" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="15" font-weight="600" fill="#2f7a3e" text-anchor="middle">🌡 uống thật lạnh</text><text x="450" y="374" font-family="Be Vietnam Pro, Arial, sans-serif" font-size="15" font-weight="400" fill="#7a6658" text-anchor="middle">Thịt đỏ → vang đỏ · hải sản, gà → vang trắng · gỏi, nộm → vang hồng · chúc mừng → vang sủi</text></svg>